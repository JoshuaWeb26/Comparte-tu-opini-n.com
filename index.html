<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario personalizado</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Compártenos tu Opinión</h1>
  </header>

  <main>
    <section>
      <p>Compártenos tu opinión sobre el canal y todo lo que he creado hasta el día de hoy, sobre la evolución y cómo podré seguir implementando en el futuro.</p>

      <div class="inform">
        <form>
          <h2>Formulario de Contacto</h2>

          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" placeholder="Eren Jagger">

          <label for="email">Tu Email</label>
          <input type="email" id="email" placeholder="erenjagger19@gmail.com">

          <label for="fecha">Tu Fecha de nacimiento</label>
          <input type="date" id="fecha">

          <label for="mensaje">Tu Mensaje</label>
          <textarea id="mensaje" rows="8" placeholder="Deja tu mensaje..."></textarea>

          <input type="submit" value="Subir">
        </form>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026-2027 Atlas Program oficial, todos los derechos reservados</p>
  </footer>

</body>
</html>
